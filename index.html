      <button id="close-chatbot" class="material-symbols-rounded">keyboard_arrow_down</button>
    </div>

    <!-- Chatbot Body -->
    <div class="chat-body">
      <div class="message bot-message">

          </path>
        </svg>
        <div class="message-text">Hey there 👋 <br /> How can I help you today?</div>
        <!-- 👇 Add this button 👇 -->
        <button class="voice-btn" data-message="Hey there 👋 How can I help you today?">
          <span class="material-symbols-rounded">volume_up</span>
        </button>
      </div>
    </div>

    <!-- Chatbot Footer -->
    <div class="chat-footer">
      <form action="#" class="chat-form">
        <textarea placeholder="Message..." class="message-input" id="speechToText" required></textarea>
        <div class="chat-controls">
          <button type="button" onclick="voice()" id="mic-button" class="material-symbols-outlined">mic</button>
          <button type="button" id="emoji-picker" class="material-symbols-outlined">sentiment_satisfied</button>
          <div class="file-upload-wrapper">
            <input type="file" accept="image/*,.zip" id="file-input" hidden>
            <img src="#">
            <button type="button" id="file-upload" class="material-symbols-rounded">attach_file</button>
            <button type="button" id="file-cancel" class="material-symbols-rounded">close</button>
          </div>
          <button type="submit" id="send-message" class="material-symbols-rounded">arrow_upward</button>
        </div>
      </form>
    </div>
  </div>
